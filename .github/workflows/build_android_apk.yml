name: Build Installable Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release 태그 이름 (스마트폰 직접 다운로드 링크 생성용)'
        required: false
        default: 'latest-apk'
  push:
    branches:
      - main
      - master
    paths:
      - 'web/**'
      - '.github/workflows/build_android_apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Set up JDK 17 (Temurin) & Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install web dependencies & sync Capacitor Android bundle
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build:apk

      - name: Build Android Release APK via Gradle
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign & Align Installable APK (V1 + V2 Signature)
        working-directory: web/android
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="$GITHUB_WORKSPACE/StockBriefing-Android.apk"

          # Generate signing keystore (uses GitHub Secret if provided, else self-signed release key)
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            KS_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias stockbriefing \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass stockbriefing123 \
              -keypass stockbriefing123 \
              -dname "CN=StockBriefing, OU=Mobile, O=StockBriefing, L=Seoul, S=Seoul, C=KR"
            KS_PASS="stockbriefing123"
            KEY_ALIAS="stockbriefing"
          fi

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"
          ls -lh "$SIGNED_APK"

      - name: Upload Installable APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockBriefing-Android-APK
          path: StockBriefing-Android.apk
          if-no-files-found: error

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'latest-apk' }}
          name: "US 공시·뉴스 AI 브리핑 Android APK (최신 빌드)"
          body: |
            ### 스마트폰(Android / 갤럭시) APK 직접 설치 파일
            1. 스마트폰에서 아래 **`StockBriefing-Android.apk`** 파일을 다운로드합니다.
            2. 다운로드된 파일을 터치하고 **'출처를 알 수 없는 앱 설치 허용'** / **'무시하고 설치'**를 누르면 즉시 앱 서랍에 **공시브리핑** 앱이 설치됩니다.
          files: StockBriefing-Android.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
